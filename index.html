 <!DOCTYPE html>
 <html lang="en">
 <head> 
      <meta charset="UTF-8">
      <title>CultureVerse</title>
      <link rel="stylesheet" href="style.css">
 </head>
 <body>
      <h1>CultureVerse <span class="globe">🌍</span></h1>
      <h2>One world. Thousands of stories. Let's explore!</h2>
      <p>Ever wondered how people celebrate, laugh, eat and live around the world?</p>
      <p>Pack your curiosity! We're taking you on a little adventure through different cultures, one story at a time.</p>
      
      <button onclick="startAdventure()">Take me somewhere! ✈️</button>
      <div id="adventure-message"></div>

     <script>
    function startAdventure() {
        document.getElementById("adventure-message").innerHTML = `
            <div class="country-card">
                <div class="country-flag"><img src="https://flagcdn.com/w80/af.png" alt="Flag of Afghanistan" width="60"></div>
                <h2>Salam from Afghanistan!</h2>
                <div class="category-menu">
    <button onclick="exploreCategory('food')">🍲 Food</button>
    <button onclick="exploreCategory('history')">🏛️ History</button>
    <button onclick="exploreCategory('music')">🎵 Music</button>
    <button onclick="exploreCategory('languages')">🗣️ Languages</button>
    <button onclick="exploreCategory('facts')">💎 Surprising Facts</button>
</div>

<div id="category-content"></div>
                <p>Welcome to a land of mountains, poetry, colourful traditions and legendary hospitality.</p>
                <button onclick="discoverAfghanistan()">Discover Afghanistan ✨</button>
                <div id="afghan-discovery"></div>
            </div>
         `;
          }
function discoverAfghanistan() {
    document.getElementById("afghan-discovery").innerHTML = `
        <h3>Wait... carrots have Afghan roots?! 🥕</h3>

<p>Here's something you probably didn't expect!</p>

<p>The carrots we know today have a fascinating history
connected to Central Asia, especially Afghanistan.</p>

<p>And here's the twist: early cultivated carrots
were purple and yellow, not orange!</p>

<p>So next time you're eating a carrot,
remember that its story goes back to this part
of the world. Pretty cool, right?</p>
        `;
         }
     
function exploreCategory(category) {
  const content = document.getElementById("category-content");

  const topics = {
    food: "🍽️ Food: Let's discover Afghanistan's delicious dishes!",
    history: "🏛️ History: Afghanistan has thousands of years of stories to tell.",
    music: "🎵 Music: Let's explore Afghan instruments and musical traditions.",
    languages: "🗣️ Languages: Discover the different languages spoken across Afghanistan.",
    facts: "💎 Surprising Facts: Ready for something you didn't know?"
  };

  content.innerHTML = `<h3>${topics[category]}</h3>`;
}
   
     </script>

 </body>
 </html>
