 <!DOCTYPE html>
 <html lang="en">
 <head> 
      <meta charset="UTF-8">
      <title>CultureVerse</title>
      <link rel="stylesheet" href="style.css">
 </head>
 <body>
      <h1>CultureVerse <span class="globe">🌍</span></h1>
      <h2>One world. Thousands of stories. Let's explore!</h2>
      <p>Ever wondered how people celebrate, laugh, eat and live around the world?</p>
      <p>Pack your curiosity! We're taking you on a little adventure through different cultures, one story at a time.</p>
      
      <button onclick="startAdventure()">Take me somewhere! ✈️</button>
      <div id="adventure-message"></div>

     <script>
   
    
function startAdventure() {
  document.getElementById("adventure-message").innerHTML = `
    <div class="country-card">
      <h2>Where shall we go? 🌍</h2>
      <p>Pick a country and let's see what makes it special!</p>

      <button onclick="openAfghanistan()" style="display: inline-flex; flex-direction: column; align-items: center; gap: 10px;">
  <img src="https://flagcdn.com/w80/af.png" alt="Afghanistan flag" width="60">
  <span>Afghanistan</span>
</button>
    </div>
  `;
}

function openAfghanistan() {
  document.getElementById("adventure-message").innerHTML = `
    <div class="country-card">
      <img src="https://flagcdn.com/w80/af.png"
           alt="Flag of Afghanistan" width="80">

      <h2>Salam from Afghanistan!</h2>
      <p>There's a lot more to discover here than you might expect.</p>

      <div class="category-menu">
        
<button onclick="exploreCategory('food')">🍲 Food & Cuisine</button>
<button onclick="exploreCategory('dance')">💃 Dance</button>
<button onclick="exploreCategory('music')">🎵 Music & Instruments</button>
<button onclick="exploreCategory('literature')">📚 Literature & Poetry</button>
<button onclick="exploreCategory('history')">🏛️ History</button>
<button onclick="exploreCategory('geography')">🗺️ Geography & Nature</button>
<button onclick="exploreCategory('cities')">🏙️ Cities & Landmarks</button>
<button onclick="exploreCategory('languages')">🗣️ Languages</button>
<button onclick="exploreCategory('ethnicities')">👥 Ethnic Groups</button>
<button onclick="exploreCategory('culture')">🎭 Culture & Traditions</button>
<button onclick="exploreCategory('festivals')">🎉 Festivals & Celebrations</button>
<button onclick="exploreCategory('clothing')">👗 Traditional Clothing</button>
<button onclick="exploreCategory('people')">🌟 Famous People</button>
<button onclick="exploreCategory('agriculture')">🍇 Fruits & Agriculture</button>
<button onclick="exploreCategory('minerals')">💎 Minerals & Natural Resources</button>
<button onclick="exploreCategory('trade')">📦 Imports & Exports</button>
<button onclick="exploreCategory('art')">🎨 Art & Handicrafts</button>
<button onclick="exploreCategory('heritage')">🏺 Archaeology & Heritage</button>
<button onclick="exploreCategory('sports')">⚽ Sports & Games</button>
<button onclick="exploreCategory('facts')">🤯 Surprising Facts</button>

      <div id="category-content"></div>
      </div>


      <button onclick="startAdventure()">← Back to countries</button>
    </div>
  `;
}

     
function exploreCategory(category) {
  const content = document.getElementById("category-content"); 
  const topics = {
  food: "🍲 Food & Cuisine",
  dance: "💃 Dance",
  music: "🎵 Music & Instruments",
  literature: "📚 Literature & Poetry",
  history: "🏛️ History",
  geography: "🏞️ Geography & Nature",
  cities: "🌆 Cities & Landmarks",
  languages: "🗣️ Languages",
  ethnicities: "👥 Ethnic Groups",
  culture: "🎭 Culture & Traditions",
  festivals: "🎉 Festivals & Celebrations",
  clothing: "👗 Traditional Clothing",
  people: "🌟 Famous People",
  agriculture: "🍇 Fruits & Agriculture",
  minerals: "💎 Minerals & Natural Resources",
  trade: "📦 Imports & Exports",
  art: "🎨 Art & Handicrafts",
  heritage: "🏺 Archaeology & Heritage",
  sports: "⚽ Sports & Games",
  facts: "🤯 Surprising Facts"
};


 
if (category === "food") {
  content.innerHTML = `
    <h3>🍲 Discover Afghan Food</h3>
    <p>Afghan cuisine has been shaped by centuries of trade, migration and cultural exchange across Central and South Asia.</p>

    <h3>🥟 Mantu</h3>
    <p>Delicate steamed dumplings filled with seasoned meat and onions, traditionally served with yoghurt, garlic and a lentil or tomato-based sauce.</p>
            <img
  src="images/mantu.jpg"
  alt="Traditional Afghan Mantu dumplings"
  style="width:100%; max-width:350px; border-radius:15px;"
>
    <h3>🍚 Qabili Palaw</h3>
    <p>One of Afghanistan's best-known dishes: fragrant rice with tender meat, carrots, raisins and warming spices. It is especially popular at celebrations.</p>

    <h3>🥬 Bolani</h3>
    <p>A thin, stuffed flatbread filled with ingredients such as potatoes, leeks or pumpkin, then cooked until golden.</p>

    <h3>🍜 Aush</h3>
    <p>A comforting noodle soup with vegetables, herbs and beans, often topped with yoghurt and a savoury meat sauce.</p>
  `;
} else {
  content.innerHTML = `<h3>${topics[category]}</h3>`;
}
}
   
     </script>

 </body>
 </html>
